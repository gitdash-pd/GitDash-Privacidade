services:
  redis:
    image: redis:8.2.3-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - gitdash_network

  postgres:
    image: postgres:18-alpine3.22
    container_name: postgres
    environment:
      POSTGRES_USER: exampleuser
      POSTGRES_PASSWORD: examplepassword123
      POSTGRES_DB: gitdashdb
    volumes:
      #- ./.docker/database:/var/lib/postgresql/data
      - ./packages/database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - gitdash_network

  backend:
    image: gitdash-backend:1.0.0
    build:
      context: packages/backend/
      dockerfile: GitDashBackend/Dockerfile
    container_name: backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=gitdashdb;Username=exampleuser;Password=examplepassword123
      - Redis__Configuration=redis:6379
      - FrontendOrigin=http://localhost:8080
      # Credenciais da OAuth App lidas do ficheiro .env (fora do git). Ver .env.example.
      - GitHub__ClientId=${GITHUB_CLIENT_ID:?Define GITHUB_CLIENT_ID no ficheiro .env}
      - GitHub__ClientSecret=${GITHUB_CLIENT_SECRET:?Define GITHUB_CLIENT_SECRET no ficheiro .env}
      # Login GitHub com acesso às listagens gerais (/api/admin). Vazio = ninguém.
      - Admin__Logins__0=${ADMIN_LOGIN:-}
      # Prazos da cache em minutos (valores curtos só para os testes do 5.3.2)
      - Cache__TtlMinutes=${CACHE_TTL_MINUTES:-30}
      - Cache__AccessCheckMinutes=${CACHE_ACCESS_CHECK_MINUTES:-5}
    ports:
      - "5053:8080"
    depends_on:
      - redis
      - postgres
    networks:
      - gitdash_network

  frontend:
    image: gitdash-frontend:1.0.0
    build:
      context: packages/frontend/GitDash
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:5053
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - gitdash_network

networks:
  gitdash_network:
    driver: bridge
